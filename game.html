        }

        const flagX = fd.isOdd ? sf.x + 258 : sf.x + 232;
        const flagBaseY = sf.y;
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(flagX, flagBaseY);
        ctx.lineTo(flagX, flagBaseY - 64);
        ctx.stroke();

        const wave = Math.sin(gameTime * 5) * 3;
        const flagDir = fd.isOdd ? 1 : -1;
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.moveTo(flagX + flagDir * 2, flagBaseY - 62);
        ctx.lineTo(flagX + flagDir * 42, flagBaseY - 52 + wave);
        ctx.lineTo(flagX + flagDir * 2, flagBaseY - 38);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#b45309';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(flagX, flagBaseY - 65, 4.5, 0, Math.PI * 2);
        ctx.fill();

        const badgeX = fd.isOdd ? sf.x + 318 : sf.x + 92;
        ctx.save();
        ctx.fillStyle = 'rgba(15, 23, 42, 0.74)';
        drawRoundedRect(badgeX, sf.y - 38, 76, 26, 6);
        ctx.fill();
        ctx.fillStyle = '#fde047';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`FLOOR ${fd.floorNum + 1}`, badgeX + 38, sf.y - 20);
        ctx.restore();

        ctx.restore();
      }

      function drawStairsObj(st, offsetY = 0, showPrompt = false) {
        ctx.save();
        ctx.translate(0, offsetY);

        const stepCount = 10;
        const stepH = (st.bottomY - st.topY) / stepCount;

        ctx.fillStyle = 'rgba(30, 41, 59, 0.14)';
        ctx.fillRect(st.x + 3, st.topY, st.width, st.bottomY - st.topY);

        ctx.fillStyle = '#92400e';
        ctx.fillRect(st.x, st.topY, 6, st.bottomY - st.topY);
        ctx.fillRect(st.x + st.width - 6, st.topY, 6, st.bottomY - st.topY);

        for (let i = 0; i < stepCount; i++) {
          const sy = st.topY + i * stepH + 6;
          ctx.fillStyle = '#d97706';
          ctx.fillRect(st.x + 4, sy, st.width - 8, 7);
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(st.x + 4, sy, st.width - 8, 2.5);
        }

        if (showPrompt) {
          const bob = Math.sin(gameTime * 6) * 4;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
          drawRoundedRect(st.x - 16, st.bottomY - 78 + bob, 80, 24, 6);
          ctx.fill();
          ctx.fillStyle = '#fef08a';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('▲ W / Up', st.x + 24, st.bottomY - 62 + bob);
        }

        ctx.restore();
      }

      function drawBlackHoles() {
        for (const bh of blackHoles) {
          if (bh.radius <= 0.5) continue;
          ctx.save();
          ctx.translate(bh.x, bh.y);

          const glow = ctx.createRadialGradient(0, 0, bh.radius * 0.4, 0, 0, bh.radius * 1.65);
          glow.addColorStop(0, 'rgba(15, 23, 42, 0.95)');
          glow.addColorStop(0.55, 'rgba(88, 28, 135, 0.65)');
          glow.addColorStop(1, 'rgba(88, 28, 135, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, bh.radius * 1.65, 0, Math.PI * 2);
          ctx.fill();

          ctx.rotate(gameTime * 6.5);
          for (let arm = 0; arm < 4; arm++) {
            ctx.save();
            ctx.rotate((arm * Math.PI) / 2);
            ctx.strokeStyle = arm % 2 === 0 ? 'rgba(192, 132, 252, 0.85)' : 'rgba(56, 189, 248, 0.7)';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(0, 0, bh.radius * 0.82, 0, Math.PI * 0.75);
            ctx.stroke();
            ctx.restore();
          }

          ctx.fillStyle = '#020617';
          ctx.beginPath();
          ctx.arc(0, 0, bh.radius * 0.68, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      function drawNoteBadge(x, y, text, bgColor, borderColor, textColor) {
        ctx.save();
        ctx.font = 'bold 15px sans-serif';
        const tw = Math.max(24, ctx.measureText(text).width + 12);
        const th = 22;
        drawRoundedRect(x - tw / 2, y - th / 2, tw, th, 7);
        ctx.fillStyle = bgColor;
        ctx.fill();
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x, y + 1);
        ctx.restore();
      }

      function drawRedCharacterList(list, offsetY = 0) {
        ctx.save();
        ctx.translate(0, offsetY);
        for (const rc of list) {
          ctx.save();
          const cx = rc.x + rc.width / 2;
          const cy = rc.y + rc.height / 2;
          ctx.translate(cx, cy);

          const step = rc.landed ? Math.sin(rc.walkCycle) * 3 : 0;
          ctx.fillStyle = '#991b1b';
          ctx.beginPath();
          ctx.arc(-5 + step, rc.height / 2 - 1, 3.5, 0, Math.PI * 2);
          ctx.arc(5 - step, rc.height / 2 - 1, 3.5, 0, Math.PI * 2);
          ctx.fill();

          drawRoundedRect(-rc.width / 2, -rc.height / 2, rc.width, rc.height - 2, 6);
          ctx.fillStyle = '#ef4444';
          ctx.fill();
          ctx.strokeStyle = '#991b1b';
          ctx.lineWidth = 2;
          ctx.stroke();

          const look = rc.walkDir || -1;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-5, -3, 4.2, 0, Math.PI * 2);
          ctx.arc(5, -3, 4.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#111827';
          ctx.beginPath();
          ctx.arc(-5 + look * 1.4, -3, 2, 0, Math.PI * 2);
          ctx.arc(5 + look * 1.4, -3, 2, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#7f1d1d';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-9, -8);
          ctx.lineTo(-2, -6.5);
          ctx.moveTo(9, -8);
          ctx.lineTo(2, -6.5);
          ctx.stroke();

          ctx.restore();

          // In 三和弦 / 七和弦 mode, draw the red man's note tag clearly above him
          if (rc.note) {
            drawNoteBadge(
              cx,
              rc.y - 16,
              fmtN(rc.note),
              '#ffffff',
              '#b91c1c',
              '#991b1b'
            );
          }
        }
        ctx.restore();
      }

      function drawTransitionWorld() {
        const t = transition.timer;
        const oldF = transition.oldFloor;
        const nextF = transition.nextFloor;

        if (t < TRANS_SINK_DUR) {
          const sinkP = easeInQuad(clamp01(t / TRANS_SINK_DUR));
          const sinkY = sinkP * 190;

          drawUpperPlatformAndCeiling(oldF, 0, 1 - sinkP);
          drawStairsObj(oldF.stairs, sinkY, false);
          drawGroundSegmentsAndPits(oldF, sinkY);
          drawStonesList(oldF.stones, sinkY, 1);
          drawRedCharacterList(transition.sinkingReds, sinkY);
          return;
        }

        if (t < TRANS_SINK_DUR + TRANS_DROP_DUR) {
          const dropP = easeInOutCubic(clamp01((t - TRANS_SINK_DUR) / TRANS_DROP_DUR));
          const sf = oldF.secondFloor;
          const curY = lerp(SECOND_FLOOR_Y, GROUND_Y, dropP);
          const curLeft = lerp(sf.x, 0, dropP);
          const curRight = lerp(sf.x + sf.width, W, dropP);
          const curW = curRight - curLeft;
          const curH = lerp(SECOND_FLOOR_THICKNESS, H - GROUND_Y, dropP);

          if (dropP < 0.72) {
            const dirtGrad = ctx.createLinearGradient(0, curY, 0, curY + curH);
            dirtGrad.addColorStop(0, '#925c33');
            dirtGrad.addColorStop(1, '#6b3e1f');
            ctx.fillStyle = dirtGrad;
            ctx.fillRect(curLeft, curY, curW, curH);

            ctx.fillStyle = '#4ade80';
            ctx.fillRect(curLeft, curY, curW, 10);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(curLeft, curY + 9, curW, 4);

            ctx.strokeStyle = '#3b2413';
            ctx.lineWidth = 2;
            ctx.strokeRect(curLeft, curY, curW, curH);
          } else {
            const offsetY = curY - GROUND_Y;
            drawGroundSegmentsAndPits(nextF, offsetY);
            const stonePop = clamp01((dropP - 0.72) / 0.28);
            drawStonesList(nextF.stones, offsetY, stonePop);
          }
          return;
        }

        const appearRaw = clamp01((t - TRANS_SINK_DUR - TRANS_DROP_DUR) / TRANS_APPEAR_DUR);
        const appearP = easeOutBack(appearRaw);
        const upperOffsetY = lerp(-300, 0, appearP);

        drawUpperPlatformAndCeiling(nextF, upperOffsetY, clamp01(appearRaw * 1.4));
        drawStairsObj(nextF.stairs, upperOffsetY, false);
        drawGroundSegmentsAndPits(nextF, 0);
        drawStonesList(nextF.stones, 0, 1);
      }

      function drawPlayer() {
        if (!player.visible) return;
        if (gamePhase === GamePhase.PIT_DEAD) return;

        ctx.save();
        const cx = player.x + player.width / 2;
        const bottomY = player.y + player.height;
        const isHanging = player.state === PlayerState.HANGING;

        if (player.invulnTimer > 0 && player.redFlashTimer <= 0 && !chordState.celebrating) {
          if (Math.floor(gameTime * 16) % 2 === 0) {
            ctx.globalAlpha = 0.55;
          }
        }

        if (isHanging) {
          ctx.translate(cx, player.y);
          ctx.scale(player.squashX, player.squashY);
          ctx.translate(0, player.height / 2);
        } else {
          ctx.translate(cx, bottomY);
          ctx.scale(player.squashX, player.squashY);
          ctx.translate(0, -player.height / 2);
        }

        const hw = player.width / 2;
        const hh = player.height / 2;

        if (isHanging) {
          ctx.fillStyle = '#16a34a';
          ctx.strokeStyle = '#14532d';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(-hw + 4, -hh + 1, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(hw - 4, -hh + 1, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        const walkOffset = player.grounded && Math.abs(player.vx) > 1 ? Math.sin(player.walkCycle) * 3.5 : 0;
        const dangle = isHanging ? Math.sin(gameTime * 5) * 2 : 0;
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.arc(-6 + walkOffset + dangle, hh - 2, 4, 0, Math.PI * 2);
        ctx.arc(6 - walkOffset + dangle, hh - 2, 4, 0, Math.PI * 2);
        ctx.fill();

        const bodyY = isHanging ? -hh + 3 : -hh;
        const bodyH = player.height - 4;
        drawRoundedRect(-hw, bodyY, player.width, bodyH, 7);

        const flashingRed = player.redFlashTimer > 0 && Math.floor(gameTime * 24) % 2 === 0;
        const flashingGood = player.goodFlashTimer > 0 && !flashingRed;
        ctx.fillStyle = flashingRed ? '#ef4444' : flashingGood ? '#4ade80' : '#22c55e';
        ctx.fill();

        if (!flashingRed) {
          ctx.fillStyle = 'rgba(187, 247, 208, 0.35)';
          drawRoundedRect(-hw + 3, bodyY + 3, player.width - 6, 7, 3);
          ctx.fill();
        }

        drawRoundedRect(-hw, bodyY, player.width, bodyH, 7);
        ctx.strokeStyle = flashingRed ? '#991b1b' : flashingGood ? '#facc15' : '#14532d';
        ctx.lineWidth = flashingGood ? 2.8 : 2.2;
        ctx.stroke();

        const eyeY = bodyY + 12;
        const pupilShiftX = isHanging ? 0 : player.facing * 1.8;
        const pupilShiftY = isHanging ? -1.4 : player.vy < -80 ? -1.2 : 0;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-5.5, eyeY, 4.6, 0, Math.PI * 2);
        ctx.arc(5.5, eyeY, 4.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-5.5 + pupilShiftX, eyeY + pupilShiftY, 2.2, 0, Math.PI * 2);
        ctx.arc(5.5 + pupilShiftX, eyeY + pupilShiftY, 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-6.4 + pupilShiftX, eyeY - 1 + pupilShiftY, 0.9, 0, Math.PI * 2);
        ctx.arc(4.6 + pupilShiftX, eyeY - 1 + pupilShiftY, 0.9, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = flashingRed ? '#7f1d1d' : '#14532d';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        if (flashingRed) {
          ctx.arc(0, bodyY + 21, 2.5, 0, Math.PI * 2);
        } else {
          ctx.arc(0, bodyY + 18.5, 3.6, 0.15 * Math.PI, 0.85 * Math.PI);
        }
        ctx.stroke();

        if (player.isJumping && keys.space) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-8, hh + 4);
          ctx.lineTo(-8, hh + 11);
          ctx.moveTo(8, hh + 4);
          ctx.lineTo(8, hh + 11);
          ctx.stroke();
        }

        ctx.restore();

        // In 三和弦 / 七和弦 mode, draw the green man's root note badge cleanly above (or below if hanging)
        if (isChordMode() && chordState.degree) {
          const activeDeg = chordState.celebrating ? chordState.celebrating.degree : chordState.degree;
          const badgeY = isHanging ? player.y + player.height + 16 : player.y - 16;
          drawNoteBadge(
            cx,
            badgeY,
            fmtN(activeDeg.root),
            '#dcfce7',
            '#15803d',
            '#14532d'
          );
        }
      }

      function drawParticlesAndTexts() {
        for (const p of particles) {
          const alpha = Math.max(0, p.life / p.maxLife);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          if (p.square) {
            ctx.fillRect(p.x - p.radius / 2, p.y - p.radius / 2, p.radius, p.radius);
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius * (0.5 + 0.5 * alpha), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        for (const ft of floatingTexts) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
          ctx.font = 'bold 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 3.5;
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }
      }

      function drawChordHUD() {
        if (!isChordMode() || !chordState.degree) return;

        const celeb = chordState.celebrating;
        const deg = celeb ? celeb.degree : chordState.degree;
        const notes = celeb ? celeb.notes : chordState.targetNotes;
        const collected = celeb ? notes.length : chordState.collectedCount;
        const title = getChordTitle(deg, gameMode);

        // Determine active arpeggio highlight index while celebrating
        let hotIdx = -1;
        let allHot = false;
        if (celeb) {
          const step = celeb.mode === GameMode.SEVENTH ? 0.23 : 0.26;
          const strumAt = notes.length * step + 0.12;
          if (celeb.timer >= strumAt) {
            allHot = true;
          } else {
            hotIdx = Math.min(notes.length - 1, Math.floor(celeb.timer / step));
          }
        }

        const slotW = 36;
        const slotGap = 8;
        const slotsTotalW = notes.length * slotW + (notes.length - 1) * slotGap;
        const infoW = 112;
        const cardW = infoW + slotsTotalW + 30;
        const cardH = showChordHint ? 66 : 48;
        const cardX = Math.round((W - cardW) / 2 + 65);
        const cardY = 22;

        ctx.save();
        ctx.fillStyle = celeb ? 'rgba(20, 83, 45, 0.92)' : 'rgba(15, 23, 42, 0.84)';
        drawRoundedRect(cardX, cardY, cardW, cardH, 10);
        ctx.fill();
        ctx.strokeStyle = celeb ? '#4ade80' : 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = celeb ? 2.2 : 1.5;
        ctx.stroke();

        // Chord title & degree on left of card
        ctx.fillStyle = title.color;
        ctx.font = 'bold 17px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(title.short, cardX + 12, cardY + 23);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '600 11px sans-serif';
        ctx.fillText(title.sub, cardX + 12, cardY + 39);

        // Note progress slots
        const startSlotX = cardX + infoW + 10;
        const slotY = cardY + 10;
        const slotH = 28;

        for (let i = 0; i < notes.length; i++) {
          const sx = startSlotX + i * (slotW + slotGap);
          const isGot = i < collected;
          const isNext = i === collected && !celeb;
          const isHot = allHot || hotIdx === i;

          drawRoundedRect(sx, slotY, slotW, slotH, 7);
          if (isHot) {
            ctx.fillStyle = '#facc15';
          } else if (isGot) {
            ctx.fillStyle = '#22c55e';
          } else if (isNext) {
            const pulse = 0.22 + 0.14 * Math.sin(gameTime * 7);
            ctx.fillStyle = `rgba(250, 204, 21, ${pulse})`;
          } else {
            ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
          }
          ctx.fill();

          ctx.strokeStyle = isHot
            ? '#fef08a'
            : isGot
              ? '#86efac'
              : isNext
                ? '#facc15'
                : 'rgba(148, 163, 184, 0.35)';
          ctx.lineWidth = isNext || isHot ? 2 : 1.2;
          ctx.stroke();

          ctx.font = 'bold 15px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          if (isGot) {
            ctx.fillStyle = isHot ? '#422006' : '#052e16';
            ctx.fillText(fmtN(notes[i]), sx + slotW / 2, slotY + slotH / 2 + 1);
          } else if (showChordHint) {
            ctx.fillStyle = isNext ? 'rgba(254, 240, 138, 0.85)' : 'rgba(148, 163, 184, 0.65)';
            ctx.fillText(fmtN(notes[i]), sx + slotW / 2, slotY + slotH / 2 + 1);
          } else {
            ctx.fillStyle = isNext ? '#fde047' : '#64748b';
            ctx.fillText('?', sx + slotW / 2, slotY + slotH / 2 + 1);
          }
        }

        // Optional hint footer (C Major mnemonic or solfege from BassChord-local)
        if (showChordHint) {
          ctx.textBaseline = 'alphabetic';
          ctx.fillStyle = '#94a3b8';
          ctx.font = '600 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(title.hintSub, cardX + cardW / 2, cardY + cardH - 8);
        }

        ctx.restore();
      }

      function drawHUD() {
        ctx.save();
        const shakeX = scoreFlashTimer > 0 ? Math.sin(gameTime * 55) * 3 : 0;

        // Score badge at top-left at all times
        ctx.fillStyle =
          scoreFlashTimer > 0
            ? 'rgba(185, 28, 28, 0.9)'
            : scoreGoodFlashTimer > 0
              ? 'rgba(21, 128, 61, 0.9)'
              : 'rgba(15, 23, 42, 0.78)';
        drawRoundedRect(14 + shakeX, 24, 138, 38, 9);
        ctx.fill();
        ctx.strokeStyle =
          scoreFlashTimer > 0
            ? '#fca5a5'
            : scoreGoodFlashTimer > 0
              ? '#86efac'
              : 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`Score: ${score}`, 26 + shakeX, 50);

        // Current Floor badge
        const displayFloor =
          gamePhase === GamePhase.TRANSITIONING && transition
            ? transition.nextFloor.floorNum
            : currentFloorNum;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
        drawRoundedRect(160, 26, 86, 34, 8);
        ctx.fill();
        ctx.fillStyle = '#fde047';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`Floor ${displayFloor}`, 203, 48);

        // State indicator pill (ON_GROUND / HANGING)
        const isHanging = player.state === PlayerState.HANGING;
        ctx.fillStyle = isHanging ? 'rgba(22, 163, 74, 0.88)' : 'rgba(15, 23, 42, 0.62)';
        drawRoundedRect(254, 29, 98, 28, 7);
        ctx.fill();
        ctx.fillStyle = isHanging ? '#dcfce7' : '#cbd5e1';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(isHanging ? 'HANGING' : 'ON_GROUND', 303, 47);

        // Chord progress HUD in 三和弦 / 七和弦 modes
        drawChordHUD();

        // Controls banner
        const bannerAlpha = controlsBannerTimer < 8 ? 0.86 : 0.64;
        ctx.fillStyle = `rgba(15, 23, 42, ${bannerAlpha})`;
        drawRoundedRect(130, H - 36, 700, 28, 7);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.font = '600 13px sans-serif';
        ctx.textAlign = 'center';
        const controlText = isMobileDevice
          ? isChordMode()
            ? '左輪盤移動/爬梯 • 右輪盤長按跳躍 / 連按兩下倒掛 — 接正確和弦音！'
            : 'Left wheel: Move / Climb  •  Right wheel: Hold to Jump, Double-tap to Hang'
          : isChordMode()
            ? 'Arrow keys to move, Space to jump, Double Space to hang — 接正確和弦音、閃避其他音！'
            : 'Arrow keys to move, Space to jump, Double Space to hang, Up to climb stairs';
        ctx.fillText(controlText, W / 2, H - 18);

        // Restart hint top-right (desktop)
        if (!isMobileDevice) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.58)';
          drawRoundedRect(W - 108, 26, 94, 26, 7);
          ctx.fill();
          ctx.fillStyle = '#e2e8f0';
          ctx.font = '600 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('R: Restart', W - 61, 43);
        }

        ctx.restore();
      }

      function drawOverlays() {
        if (gamePhase === GamePhase.PIT_DEAD) {
          ctx.save();
          ctx.fillStyle = 'rgba(15, 23, 42, 0.58)';
          ctx.fillRect(0, 0, W, H);

          ctx.fillStyle = '#0f172a';
          drawRoundedRect(W / 2 - 215, H / 2 - 96, 430, 192, 14);
          ctx.fill();
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          ctx.fillStyle = '#fca5a5';
          ctx.font = 'bold 30px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('You Fell Into a Pit!', W / 2, H / 2 - 44);

          ctx.fillStyle = '#fef08a';
          ctx.font = 'bold 16px sans-serif';
          const statsLine = isChordMode()
            ? `Floor ${currentFloorNum}  •  Score: ${score}  •  Chords: ${chordState.chordsCleared}`
            : `Floor ${currentFloorNum}  •  Score: ${score}`;
          ctx.fillText(statsLine, W / 2, H / 2 - 12);

          ctx.fillStyle = '#22c55e';
          drawRoundedRect(W / 2 - 118, H / 2 + 8, 236, 38, 9);
          ctx.fill();
          ctx.fillStyle = '#052e16';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText(`Respawn Floor ${currentFloorNum} (Enter / Click)`, W / 2, H / 2 + 32);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '13px sans-serif';
          ctx.fillText('Press R to restart from Floor 1', W / 2, H / 2 + 72);
          ctx.restore();
        }
      }

      function render() {
        drawBackground();
        drawTopRoof();

        if (gamePhase === GamePhase.TRANSITIONING && transition) {
          drawTransitionWorld();
        } else {
          drawUpperPlatformAndCeiling(floorData, 0, 1);
          const showStairHint =
            gamePhase === GamePhase.PLAYING &&
            isNearStairs() &&
            !player.onStairs &&
            player.state === PlayerState.ON_GROUND;
          drawStairsObj(floorData.stairs, 0, showStairHint);
          drawGroundSegmentsAndPits(floorData, 0);
          drawStonesList(floorData.stones, 0, 1);
          drawBlackHoles();
          drawRedCharacterList(redChars, 0);
        }

        drawPlayer();
        drawParticlesAndTexts();
        drawHUD();
        drawOverlays();
      }

      // ============================================================
      // MAIN LOOP
      // ============================================================
      let lastTimestamp = performance.now();
      function loop(timestamp) {
        const dt = Math.min(0.05, Math.max(0, (timestamp - lastTimestamp) / 1000));
        lastTimestamp = timestamp;

        syncMobileUI();
        if (!isPortraitBlocked) {
          update(dt);
        }
        render();

        requestAnimationFrame(loop);
      }

      syncMobileUI();
      resetLevel();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
